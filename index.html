<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortsTik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/feed.css" />
    <link rel="stylesheet" href="./styles/search.css" />
    <link rel="stylesheet" href="./styles/profile.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content">
        <section id="feedTab" class="tab-panel active" aria-label="Feed principal">
          <header class="topbar topbar-feed">
            <div class="brand-block">
              <span class="brand-pill">ShortsTik</span>
            </div>
            <div class="topbar-icons">
              <button class="ghost-btn" aria-label="Buscar">⌕</button>
              <button class="ghost-btn" aria-label="Notificações">🔔</button>
            </div>
          </header>
          <div id="feedList" class="feed-list" aria-live="polite"></div>
        </section>

        <section id="searchTab" class="tab-panel" aria-label="Pesquisa">
          <header class="topbar topbar-search">
            <div class="search-header">
              <h2>Descobrir</h2>
            </div>
          </header>
          <div class="search-wrap">
            <div class="search-input-box">
              <span>⌕</span>
              <input id="searchInput" type="text" placeholder="Buscar usuários ou etiquetas" />
            </div>
            <div id="trendingTags" class="trending-tags"></div>
            <div id="searchResults" class="search-results"></div>
          </div>
        </section>

        <section id="profileTab" class="tab-panel" aria-label="Perfil do usuário">
          <header class="topbar topbar-profile">
            <div class="profile-header-row">
              <button class="icon-circle" aria-label="Voltar">←</button>
              <h2>Perfil</h2>
              <button class="icon-circle" aria-label="Mais opções">⋮</button>
            </div>
          </header>
          <div id="profileContent" class="profile-content"></div>
        </section>

        <section id="settingsTab" class="tab-panel" aria-label="Configurações">
          <header class="topbar topbar-settings">
            <div class="settings-header-row">
              <h2>Configurações</h2>
            </div>
          </header>
          <div id="settingsContent" class="settings-content"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-target="feedTab" aria-label="Assistir">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Assistir</span>
        </button>
        <button class="nav-item" data-target="searchTab" aria-label="Pesquisar">
          <span class="nav-icon">⌕</span>
          <span class="nav-label">Buscar</span>
        </button>
        <button id="publishBtn" class="nav-item publish-btn" aria-label="Publicar vídeo">
          <span class="nav-icon">＋</span>
        </button>
        <button class="nav-item" data-target="profileTab" aria-label="Perfil">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Perfil</span>
        </button>
        <button class="nav-item" data-target="settingsTab" aria-label="Configurações">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Config.</span>
        </button>
      </nav>
    </div>

    <div id="uploadModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
        <div class="modal-header">
          <h3 id="uploadTitle">Publicar novo vídeo</h3>
          <button id="closeUploadModal" class="close-btn" aria-label="Fechar modal">✕</button>
        </div>
        <form id="uploadForm" class="upload-form">
          <label>
            <span>Título do vídeo</span>
            <input id="uploadTitleInput" type="text" placeholder="Ex.: Meu novo momento" required />
          </label>
          <label>
            <span>URL do vídeo</span>
            <input id="uploadUrlInput" type="url" placeholder="https://...mp4" required />
          </label>
          <button type="submit" class="primary-btn">Publicar</button>
        </form>
      </div>
    </div>

    <aside id="commentSheet" class="comment-sheet hidden" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3>Comentários</h3>
        <button id="closeCommentSheet" class="close-btn" aria-label="Fechar comentários">✕</button>
      </div>
      <div id="commentList" class="comment-list"></div>
      <form id="commentForm" class="comment-form">
        <input id="commentInput" type="text" placeholder="Adicione um comentário..." maxlength="180" required />
        <button type="submit" class="primary-btn">Enviar</button>
      </form>
    </aside>

    <script src="./scripts/app.js" defer></script>
    <script src="./scripts/feed.js" defer></script>
    <script src="./scripts/search.js" defer></script>
    <script src="./scripts/profile.js" defer></script>
    <script src="./scripts/settings.js" defer></script>
  </body>
</html>
